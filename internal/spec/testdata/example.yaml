name: shop
services:
  mysql:
    kind: stateful
    image: mysql:8.4
    volumes:
      data: /var/lib/mysql
    env:
      MYSQL_DATABASE: shop
    secrets: [MYSQL_ROOT_PASSWORD]
    healthcheck:
      cmd: ["mysqladmin", "ping", "-h", "127.0.0.1"]

  migrate:
    kind: job
    phase: pre-deploy          # pre-deploy | post-deploy
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./app", "migrate"]
    depends_on: [mysql]
    secrets: [DATABASE_URL]

  api:
    kind: deployment
    strategy: blue-green       # blue-green | recreate
    build:
      context: .
      dockerfile: Dockerfile
    command: ["./app", "serve"]
    depends_on: [mysql]
    secrets: [DATABASE_URL]
    http:
      port: 8080
      path: /api
    healthcheck:
      http: /healthz
    resources:
      memory: 512m
      cpus: 0.5

  scheduler:
    kind: deployment
    strategy: recreate         # must never run twice
    build:
      context: .
    command: ["./app", "cron"]
