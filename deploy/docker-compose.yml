# Bootstrap: the only thing started by hand (docs/design.md section 13).
#
#   openssl rand -base64 32 > master_key && chmod 600 master_key
#   DOCKERITY_HOST=dockerity.example.com docker compose up -d
#
# Update Dockerity by pulling or rebuilding this stack, outside Dockerity.
name: dockerity

services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.docker.network=dockerity-edge
      # App routes: Dockerity writes one file per environment here.
      - --providers.file.directory=/traefik
      - --providers.file.watch=true
      # HTTPS for app domains is set in Dockerity's settings (TLS mode).
      # Certificate mode: put the wildcard certificate in ./certs and set the
      # paths /certs/<file> in the settings.
      # Resolver mode: define a resolver here and set its name in the settings,
      # for example Let's Encrypt with a DNS challenge:
      # - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # - --certificatesresolvers.le.acme.email=ops@example.com
      # - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "${DOCKERITY_HTTP_PORT:-80}:80"
      - "${DOCKERITY_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dockerity-traefik:/traefik:ro
      - ./certs:/certs:ro
    networks:
      - edge
    labels:
      dockerity.system: "true"

  dockerity:
    image: ${DOCKERITY_IMAGE:-dockerity:local}
    build:
      context: ..
    restart: unless-stopped
    environment:
      DOCKERITY_LOG_LEVEL: ${DOCKERITY_LOG_LEVEL:-info}
      DOCKERITY_TRAEFIK_DYNAMIC_DIR: /traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dockerity-data:/data
      - dockerity-backups:/backups
      - dockerity-traefik:/traefik
    secrets:
      - master_key
    networks:
      - edge
    labels:
      dockerity.system: "true"
      traefik.enable: "true"
      traefik.http.routers.dockerity.rule: Host(`${DOCKERITY_HOST:-dockerity.localhost}`)
      traefik.http.routers.dockerity.entrypoints: web
      traefik.http.services.dockerity.loadbalancer.server.port: "8080"

networks:
  edge:
    name: dockerity-edge

volumes:
  dockerity-data:
    name: dockerity-data
  dockerity-backups:
    name: dockerity-backups
  dockerity-traefik:
    name: dockerity-traefik

secrets:
  master_key:
    file: ./master_key
